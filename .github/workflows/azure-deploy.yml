# CD: provision/update Azure infra with Bicep, then build, push, and deploy
# the container image to Azure Container Apps.
# Exam topics: OIDC federated credentials (no stored secrets), environments +
# approvals, Bicep deployments, ACR, Container Apps revisions.
#
# One-time setup (run scripts/setup-azure-oidc.sh on your machine):
#   1. Entra app + federated credential for environment "development"
#   2. Role assignments: Contributor + Key Vault Secrets Officer on the RG
#   3. GitHub environment secrets/vars (see script output)
name: Deploy to Azure

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - doc/**
      - docs/**
  workflow_dispatch:

permissions:
  id-token: write # required for OIDC -> Azure login
  contents: read

env:
  RG: ${{ vars.AZURE_RG }}
  LOCATION: ${{ vars.AZURE_LOCATION }}
  IMAGE_NAME: hrv-service

jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment: development
    steps:
      - uses: actions/checkout@v7

      - name: Azure login (OIDC)
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Ensure resource group exists
        run: |
          az group create --name "$RG" --location "$LOCATION" --output none

      - name: Deploy infrastructure (Bicep)
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
        run: |
          set -euo pipefail
          # azure/arm-deploy@v2 still targets Node.js 20. Azure CLI deploys the
          # same template without that action.
          for attempt in 1 2 3; do
            if az deployment group create \
              --resource-group "$RG" \
              --name main \
              --mode Incremental \
              --template-file infra/main.bicep \
              --parameters environmentName=hrv-dev jwtSecret="$JWT_SECRET"; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            echo "Deployment attempt ${attempt} failed; retrying in 30s so Key Vault RBAC can propagate."
            sleep 30
          done

      - name: Build and push image to ACR (cloud build)
        run: |
          ACR=$(az acr list -g "$RG" --query "[0].loginServer" -o tsv)
          az acr build -r "$ACR" -t "${IMAGE_NAME}:${{ github.sha }}" -t "${IMAGE_NAME}:latest" .

      - name: Update Container App to new image
        run: |
          APP=$(az containerapp list -g "$RG" --query "[0].name" -o tsv)
          ACR=$(az acr list -g "$RG" --query "[0].loginServer" -o tsv)
          az containerapp update -n "$APP" -g "$RG" -i "$ACR/${IMAGE_NAME}:${{ github.sha }}"

      - name: Smoke test /actuator/health
        run: |
          APP=$(az containerapp list -g "$RG" --query "[0].name" -o tsv)
          FQDN=$(az containerapp show -n "$APP" -g "$RG" --query properties.configuration.ingress.fqdn -o tsv)
          for i in 1 2 3 4 5 6; do
            if curl -fsS "https://$FQDN/actuator/health" | grep -q '"status":"UP"'; then
              echo "Healthy at https://$FQDN"
              exit 0
            fi
            sleep 10
          done
          echo "Health check failed for https://$FQDN"
          exit 1
