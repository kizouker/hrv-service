# CI: build, test, and validate the container image on every push/PR.
# Exam topics: GitHub Actions triggers, hosted runners, Java builds, test
# reports, container build validation.
name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: hrvdb
          POSTGRES_USER: hrv_user
          POSTGRES_PASSWORD: hrv_test_pw
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hrv_user -d hrvdb"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: jdbc:postgresql://localhost:5432/hrvdb
      POSTGRES_DB: hrvdb
      POSTGRES_USER: hrv_user
      POSTGRES_PASSWORD: hrv_test_pw
      APP_PORT: 8080
      # JwtUtil expects a Base64-encoded 256-bit+ secret (see JwtUtilTest).
      JWT_SECRET: dGVzdC1zZWNyZXQta2V5LXRoYXQtaXMtbG9uZy1lbm91Z2gtZm9yLUhNQUMtU0hBLTI1Ng==
      JWT_EXPIRATION_MS: 86400000
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: "21"
          distribution: temurin
          cache: maven

      - name: "Build and test (JaCoCo gate: 70% line coverage)"
        run: mvn -B verify

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: jacoco-report
          path: target/site/jacoco/

  docker-build:
    runs-on: ubuntu-24.04
    needs: build-and-test
    steps:
      - uses: actions/checkout@v7

      - name: Validate Dockerfile builds
        run: |
          set -euo pipefail
          docker build -t hrv-service:ci .
          docker save hrv-service:ci -o hrv-service.tar

      - name: Upload image for deploy
        uses: actions/upload-artifact@v7
        with:
          name: hrv-service-image
          path: hrv-service.tar
          retention-days: 5
          compression-level: 1
