# CI: build, test, and validate the container image on every push/PR.
# Exam topics: GitHub Actions triggers, hosted runners, Java builds, test
# reports, container build validation.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: hrvdb
          POSTGRES_USER: hrv_user
          POSTGRES_PASSWORD: hrv_test_pw
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hrv_user -d hrvdb"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: jdbc:postgresql://localhost:5432
      POSTGRES_DB: hrvdb
      POSTGRES_USER: hrv_user
      POSTGRES_PASSWORD: hrv_test_pw
      APP_PORT: 8080
      JWT_SECRET: test-secret-key-that-is-long-enough-for-hs256-0123456789
      JWT_EXPIRATION_MS: 86400000
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
          cache: maven

      - name: "Build and test (JaCoCo gate: 70% line coverage)"
        run: mvn -B verify

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco/

  docker-build:
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@v4

      - name: Validate Dockerfile builds
        run: docker build -t hrv-backend:ci .
