# Local dev: app + PostgreSQL. Values can be overridden via a .env file
# (see example.env) — compose loads it automatically.
services:
  postgres:
    image: postgres:16-alpine
    container_name: hrv-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - hrv-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    env_file: .env
    build: .
    container_name: hrv-backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Full JDBC URL inside the compose network.
      DATABASE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET Has to be defined in .env}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS}
      APP_PORT: 8080
    ports:
      - "${APP_PORT}:8080"
    restart: unless-stopped

volumes:
  hrv-pgdata:
