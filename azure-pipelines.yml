# Lab 11. Stage, job, step. trigger none so a push does not start it.
# The handout says ubuntu-latest. Pinned to 24.04 so the image does not
# change when ubuntu-latest moves to Ubuntu 26.
trigger: none

pool:
  vmImage: ubuntu-24.04

stages:
  - stage: Build
    jobs:
      - job: Test
        steps:
          - script: echo "mvn verify would run here"

  - stage: Deploy
    dependsOn: Build
    jobs:
      - deployment: DeployDev
        environment: dev
        strategy:
          runOnce:
            deploy:
              steps:
                - script: echo "Deploying to dev"
