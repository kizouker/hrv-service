spring:
  application:
    name: hrv-backend

  datasource:
    hikari:
      initialization-fail-timeout: -1  # starta appen även om DB är nere
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/hrvdb}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

server:

jwt:
  secret: ${JWT_SECRET:YWJjZGVmZ2hpamtsbW5vcHFyc3R1dnd4eXoxMjM0NTY=}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}  # 24 hours

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha
  info:
    title: HRV API
    description: Heart Rate Variability tracking and analytics REST API
    version: 1.0.0

management:
  health:
    db:
      enabled: false  # låt Railway healthcheck passera utan DBspring:
  datasource:
    hikari:
      initialization-fail-timeout: -1  # starta appen även om DB är nere
  jpa:
    hibernate:
      ddl-auto: update
